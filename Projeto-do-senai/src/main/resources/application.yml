spring:
  application:
    name: ocorrencia-escolar

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ocorrenciaescolar}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    # Desligado de proposito: com open-in-view a sessao fica aberta durante a
    # serializacao da resposta, o que esconde consultas N+1 no adaptador web.
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25

  # Estava aninhado dentro de spring.jpa, onde o Spring Boot simplesmente ignora
  # a chave — o Flyway rodava so' pelo default do starter.
  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  cors:
    # Origens do front. Configuravel para nao deixar endereco de desenvolvimento no jar.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-hours: ${JWT_EXPIRATION_HOURS:2}
    # Só habilite atras de um proxy reverso confiavel: com true a aplicacao passa a
    # acreditar no cabecalho X-Forwarded-For para identificar o cliente no rate limit.
    trusted-proxy: ${APP_TRUSTED_PROXY:false}

  rate-limit:
    login:
      tentativas: ${LOGIN_RATE_LIMIT_TENTATIVAS:5}
      janela: ${LOGIN_RATE_LIMIT_JANELA:1m}
      maximo-de-chaves: 10000
      habilitado: true

  messaging:
    rabbit:
      enabled: ${APP_RABBIT_ENABLED:false}
      queue: ${APP_RABBIT_QUEUE:sistema-escolar.audit}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    br.com.project_sena: ${LOG_LEVEL:INFO}
