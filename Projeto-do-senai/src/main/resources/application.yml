spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ocorrenciaescolar
    username: postgres
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
       dialect: org.hibernate.dialect.PostgreSQLDialect

    flyway:
      enabled: true
  security:
    token:
      secret:
        ${JWT_SECRET}
app:
  cors:
    allowed-origins:
      "http://127.0.0.1:5500,http://localhost:5500"