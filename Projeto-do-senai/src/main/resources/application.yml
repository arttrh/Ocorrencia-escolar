server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:ocorrenciaescolar}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
    hikari:
      maximum-pool-size: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
